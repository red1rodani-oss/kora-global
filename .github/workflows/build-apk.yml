
name: Build Kora Global APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Inspect and locate Android project
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Searching for Gradle wrapper..."
          GRADLEW_PATH="$(find . -type f -name gradlew -not -path '*/.git/*' -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Could not find gradlew in the checked-out repository."
            find . -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle wrapper: $GRADLEW_PATH"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kora-global-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
